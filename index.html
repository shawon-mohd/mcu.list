<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mcu list</title>
    <style>
        :root {
            --bg-color: #f7f7f8;
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-muted: #8e8e93;
            --border-color: #e5e5ea;
            --btn-bg: #e9e9eb;
            --star-color: #f5c518;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1c1c1e;
            --text-main: #f2f2f7;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
            --btn-bg: #2c2c2e;
            --star-color: #f5c518;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
            transition: background-color 0.2s ease, color 0.2s ease;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .action-btn {
            background-color: var(--btn-bg);
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem 0.85rem;
            border-radius: 8px;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        /* Controls Area */
        .controls-container {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .search-input {
            flex-grow: 1;
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--text-muted);
        }

        /* Movie List */
        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* Movie Card Layout matching target UI */
        .movie-card {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 0.85rem;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        /* Poster */
        .movie-poster-wrapper {
            flex-shrink: 0;
            width: 80px;
            aspect-ratio: 2 / 3;
            background-color: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Movie Info Area */
        .movie-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.35rem;
            min-width: 0;
        }

        .movie-title-area {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.01em;
            color: var(--text-main);
            word-wrap: break-word;
        }

        .movie-season {
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Inline Metadata Row */
        .movie-meta {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .meta-dot {
            font-size: 0.6rem;
            line-height: 1;
        }

        /* Rating Row */
        .movie-rating {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-top: 0.1rem;
        }

        .movie-rating-star {
            color: var(--star-color);
            font-size: 0.9rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 0;
            font-size: 0.95rem;
        }

        /* Responsive adjustments */
        @media (max-width: 500px) {
            .movie-card {
                gap: 0.9rem;
                padding: 0.75rem;
            }

            .movie-poster-wrapper {
                width: 70px;
            }

            .movie-title-area {
                font-size: 1rem;
            }

            .movie-meta, .movie-rating {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>mcu.list</h1>
            <div class="header-actions">
                <button class="action-btn" id="sortBtn">Oldest First ↑</button>
                <button class="action-btn" id="themeToggle" aria-label="Toggle theme">Light mode</button>
            </div>
        </header>

        <main>
            <div class="controls-container">
                <input 
                    type="search" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search by title..."
                    autocomplete="off"
                >
            </div>

            <div class="movie-list" id="movieList">
                <!-- Data populated here -->
            </div>
        </main>
    </div>

    <script>
        let allMovies = [];
        let isAscending = true; // Default sorting state: Oldest first
        
        // DOM Elements
        const movieListElement = document.getElementById('movieList');
        const searchInput = document.getElementById('searchInput');
        const themeToggleBtn = document.getElementById('themeToggle');
        const sortBtn = document.getElementById('sortBtn');

        // Theme Initialization (Default dark mode to match target design)
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeButtonText(savedTheme);

        // Fetch Data
        async function loadMovies() {
            try {
                const response = await fetch('./data.json');
                
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                allMovies = await response.json();
                processAndRender();
            } catch (error) {
                console.error('Error loading movie data:', error);
                movieListElement.innerHTML = `
                    <div class="empty-state">
                        Failed to load data.json. Ensure the file is in the same directory and served via a web server.
                    </div>`;
            }
        }

        // Process Filter & Sort, then Render
        function processAndRender() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            // Filter by title
            let filtered = allMovies.filter(movie => 
                (movie.title || '').toLowerCase().includes(searchTerm)
            );

            // Sort by release_date (Oldest first default)
            filtered.sort((a, b) => {
                const dateA = new Date(a.release_date || '9999-12-31');
                const dateB = new Date(b.release_date || '9999-12-31');
                return isAscending ? dateA - dateB : dateB - dateA;
            });

            renderMovies(filtered);
        }

        // Render Cards matching requested UI layout
        function renderMovies(movies) {
            if (movies.length === 0) {
                movieListElement.innerHTML = '<div class="empty-state">No matching titles found.</div>';
                return;
            }

            const html = movies.map(movie => {
                const rating = movie.imdb_rating ? movie.imdb_rating.toFixed(1) : 'N/A';
                const runtime = movie.runtime ? `${movie.runtime}m` : 'N/A';
                const year = movie.year || (movie.release_date ? movie.release_date.split('-')[0] : '');
                const type = movie.type || 'Video';
                const seasonText = movie.season ? `<span class="movie-season">(Season ${movie.season})</span>` : '';

                // Build metadata row dynamically based on available fields
                const metaParts = [year, runtime, type].filter(Boolean);
                const metaFormatted = metaParts.join(' <span class="meta-dot">&bull;</span> ');

                return `
                    <article class="movie-card">
                        <div class="movie-poster-wrapper">
                            <img 
                                src="${movie.cover_img}" 
                                alt="${movie.title}" 
                                class="movie-poster"
                                loading="lazy"
                                onerror="this.style.display='none'"
                            >
                        </div>
                        <div class="movie-info">
                            <div class="movie-title-area">
                                ${movie.title} ${seasonText}
                            </div>
                            <div class="movie-meta">
                                ${metaFormatted}
                            </div>
                            <div class="movie-rating">
                                <span class="movie-rating-star">★</span> ${rating}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            movieListElement.innerHTML = html;
        }

        // Search Logic
        searchInput.addEventListener('input', processAndRender);

        // Sort Button Toggle Logic
        sortBtn.addEventListener('click', () => {
            isAscending = !isAscending;
            sortBtn.textContent = isAscending ? 'Oldest First ↑' : 'Newest First ↓';
            processAndRender();
        });

        // Theme Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButtonText(newTheme);
        });

        function updateThemeButtonText(theme) {
            themeToggleBtn.textContent = theme === 'light' ? 'Dark mode' : 'Light mode';
        }

        // Initialize application
        loadMovies();
    </script>
</body>
</html>
