<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mcu list</title>
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --line: #eeeeee;
            --poster-bg: #f5f5f7;
        }

        [data-theme="dark"] {
            --bg: #0d0d0d;
            --text-main: #ffffff;
            --text-muted: #666666;
            --line: #1a1a1a;
            --poster-bg: #181818;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.2s, color 0.2s;
        }

        .container {
            max-width: 580px;
            margin: 0 auto;
            padding: 3rem 1.25rem;
        }

        /* Minimal Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            text-transform: lowercase;
        }

        .header-actions {
            display: flex;
            gap: 1.25rem;
        }

        button.action-btn {
            background: none;
            border: 1px solid var(--line);
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 4px;
            transition: color 0.15s ease;
        }

        button.action-btn:hover {
            color: var(--text-main);
        }

        .controls-container {
            margin-bottom: 2.5rem;
        }

        .search-input {
            width: 100%;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--text-main);
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-bottom-color: var(--text-main);
        }

        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .movie-card {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: inherit;
        }

        .movie-poster-wrapper {
            flex-shrink: 0;
            width: 80px;
            aspect-ratio: 2 / 3;
            background-color: var(--poster-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(20%);
            transition: filter 0.2s ease, transform 0.2s ease;
        }

        .movie-card:hover .movie-poster {
            filter: grayscale(0%);
            transform: scale(1.03);
        }

        /* Clean Typography Hierarchy */
        .movie-info {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            min-width: 0;
        }

        .movie-title-area {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
        }

        .movie-season {
            color: var(--text-muted);
            font-weight: 400;
        }

        .movie-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .meta-dot {
            font-size: 0.5rem;
            opacity: 0.5;
        }

        .movie-rating {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .movie-rating-star {
            font-size: 0.8rem;
            color: #ffde34;
            margin-top: -0.1rem;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 0;
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1rem;
            }
            .movie-poster-wrapper {
                width: 60px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>mcu<span style='color: #ed1d24;'>.list</span></h1>
            <div class="header-actions">
                <button class="action-btn" id="sortBtn">oldest</button>
                <button class="action-btn" id="themeToggle" aria-label="Toggle theme">light</button>
            </div>
        </header>

        <main>
            <div class="controls-container">
                <input 
                    type="search" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search..."
                    autocomplete="off"
                >
            </div>

            <div class="movie-list" id="movieList"></div>
        </main>
    </div>

    <script>
        let allMovies = [];
        let isAscending = true;
        
        const movieListElement = document.getElementById('movieList');
        const searchInput = document.getElementById('searchInput');
        const themeToggleBtn = document.getElementById('themeToggle');
        const sortBtn = document.getElementById('sortBtn');

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeButtonText(savedTheme);

        async function loadMovies() {
            try {
                const response = await fetch('./data.json');
                if (!response.ok) throw new Error('Network response was not ok');
                allMovies = await response.json();
                processAndRender();
            } catch (error) {
                console.error('Error loading movie data:', error);
                movieListElement.innerHTML = `
                    <div class="empty-state">
                        Failed to load data.
                    </div>`;
            }
        }

        function processAndRender() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            let filtered = allMovies.filter(movie => 
                (movie.title || '').toLowerCase().includes(searchTerm)
            );

            filtered.sort((a, b) => {
                const dateA = new Date(a.release_date || '9999-12-31');
                const dateB = new Date(b.release_date || '9999-12-31');
                return isAscending ? dateA - dateB : dateB - dateA;
            });

            renderMovies(filtered);
        }

        function renderMovies(movies) {
            if (movies.length === 0) {
                movieListElement.innerHTML = '<div class="empty-state">No items found</div>';
                return;
            }

            const html = movies.map(movie => {
                const rating = movie.imdb_rating ? movie.imdb_rating.toFixed(1) : 'N/A';
                const runtime = movie.runtime ? `${movie.runtime}m` : 'N/A';
                const year = movie.year || (movie.year ? movie.year : 'N/A');
                const type = movie.type || null;
                const seasonText = movie.season ? `<span class="movie-season"> — Season ${movie.season}</span>` : '';

                const metaParts = [year, runtime, type].filter(Boolean);
                const metaFormatted = metaParts.join(' <span class="meta-dot">•</span> ');

                return `
                    <article class="movie-card">
                        <div class="movie-poster-wrapper">
                            <img 
                                src="${movie.cover_img}" 
                                alt="${movie.title}" 
                                class="movie-poster"
                                loading="lazy"
                                onerror="this.style.display='none'"
                            >
                        </div>
                        <div class="movie-info">
                            <div class="movie-title-area">
                                ${movie.title}${seasonText}
                            </div>
                            <div class="movie-meta">
                                ${metaFormatted}
                            </div>
                            ${rating ? `
                                <div class="movie-rating">
                                    <span class="movie-rating-star">★</span> ${rating}
                                </div>
                            ` : ''}
                        </div>
                    </article>
                `;
            }).join('');

            movieListElement.innerHTML = html;
        }

        searchInput.addEventListener('input', processAndRender);

        sortBtn.addEventListener('click', () => {
            isAscending = !isAscending;
            sortBtn.textContent = isAscending ? 'oldest' : 'newest';
            processAndRender();
        });

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButtonText(newTheme);
        });

        function updateThemeButtonText(theme) {
            themeToggleBtn.textContent = theme === 'light' ? 'dark' : 'light';
        }

        loadMovies();
    </script>
    <footer></footer>
</body>
</html>
